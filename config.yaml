# =============================================================================
# BioReef.ai — Pipeline Configuration
# =============================================================================
# Single control center for the whole pipeline. Edit values here; the pipelines
# read them.
#
#   inference:  python inference/inference_pipeline.py            (reads this file)
#   training:   torchrun scripts/training/train_stage1.py         (reads this file)
#   override file location with --config <path>.
#
# This config targets the CORRECTED pipeline (KNOWN_BUGS #1-13 fixed): the class
# key is the full binomial (→ ~329 classes at min_samples 20, not the old merged
# ~256), crops are augmented AFTER cropping, BGR→RGB is fixed, CB-Focal/HSLM are
# corrected. The old shipped checkpoint (bioreef_stage1.pt) was trained WITH those
# bugs and is retired — Stage 1 must be RETRAINED on this config before inference
# uses the new weights (see "Stage 1 (classifier)" note under inference).
# =============================================================================

# ---- Shared (used by both training and inference) ---------------------------
shared:
  # Full OzFish metadata CSV. Training derives its own binomial-keyed, placeholder-
  # filtered, min_samples class set from this (split_dataset). The old 256-class
  # subset (frame_metadata_subset.csv) existed only to match the retired
  # checkpoint's merged label space — not used by the corrected pipeline.
  csv_path: frame_metadata.csv
  min_samples: 20
  device: null            # null → cuda if available; or "cuda:0" / "cuda:1" / "cpu"
  apply_waternet: false   # #14: keep WaterNet OFF for the detector (hurts recall ~5.6pp)

# ---- Inference pipeline -----------------------------------------------------
inference:
  # --- input ---
  video: null                       # path to a single clip, OR set frames_dir
  frames_dir: null                  # list of frame dirs (alternative to video)
  video_id: null                    # cache key / output name; null → derived

  # --- detector (Stage 0) ---
  detector_backend: rfdetr          # rfdetr | yolo
  detection_ckpt: null              # null → backend default (weights/rfdetr_medium_cfd.pth)
  rfdetr_size: medium               # medium | small | nano
  imgsz: 960                        # yolo only
  conf_threshold: 0.3               # detection confidence floor

  # --- Stage 1 (classifier) ---
  # The retrain is DONE. This is D6a: DINOv3 ViT-H+/16 (~840 M), full fine-tune,
  # lr 2.5e-6, 321 binomial classes, trained in the research repo on the
  # leakage-safe OzFish split. It replaces the retired bioreef_stage1.pt, which
  # was trained with KNOWN_BUGS #1-13 and whose ~256-class merged head does not
  # match this label space. Both checkpoint formats still load (see
  # _9_pipeline/models.py) -- the old file works if you point this back at it.
  # Weights are NOT in git (~3.5 GB); see models/README.md for provenance.
  stage1_ckpt: models/d6a_stage1.pt

  # Post-hoc logit adjustment for the long tail (Menon 2020 / Balanced Softmax).
  # Subtracts tau * log(class_prior) from the raw logits before Stage-2 softmax.
  # No retraining: it changes the decision rule, not the weights, so tau stays
  # tunable here. On the D6a test set tau=1.0 trades top-1 0.8756 -> 0.8712 for
  # tail 0.5800 -> 0.6722 and mistake-severity 1.7152 -> 1.6532; raise it toward
  # 1.5 for still more tail at more top-1 cost. Set tau to 0 to disable.
  stage1_prior: models/d6a_prior.json
  stage1_logit_tau: 1.0

  # --- Stage 2 (tracker) ---
  high_thresh: 0.6
  low_thresh: 0.1
  max_lost_age: 30
  iou_threshold: 0.3
  appearance_threshold: 0.4
  ema_alpha: 0.9
  no_cmc: false
  min_tracklet_len: 16
  max_tracklet_len: 30

  # --- Stage 2 aggregation (#5 hierarchical fallback) ---
  species_thresh: 0.50
  genus_thresh: 0.60
  family_thresh: 0.70

  # --- Stage 3 (future) ---
  run_stage3: false

  # --- output / cache ---
  output_dir: outputs/detections
  cache_dir: outputs/cache          # null disables stage caching
  no_cache: false
  from_stage: preprocess            # preprocess | stage1 | stage2 | stage3
  to_stage: stage2

# ---- Training pipeline (Stage 1) --------------------------------------------
# DDP multi-GPU trainer — launch with torchrun, e.g.:
#   torchrun --nproc_per_node=2 scripts/training/train_stage1.py
# Every knob below is read via TrainingConfig.from_yaml (merged over `shared:`).
training:
  # Full CSV (inherited from shared); split_dataset does the binomial-key,
  # placeholder, image-on-disk and min_samples filtering itself → ~329 classes.
  csv_path: frame_metadata.csv
  img_dir: data_oz/frames_waternet_1
  use_waternet: false               # #14: WaterNet off (matches the eval path)

  epochs: null                      # null → 30 standard / 10 decoupled
  batch_size: 8                     # per-rank
  warmup_epochs: 3
  ema_decay: 0.999

  # --- loss: HSLM ON (the corrected hierarchy loss is the point of the retrain) --
  # HSLM adds the marginalized genus/family terms on top of the (now-correct)
  # CB-Focal species term; the taxonomy tree is binomial-keyed so genus/family
  # align with the class head. Missing taxonomy is now FATAL (KNOWN_BUGS #8), so
  # a mis-keyed tree fails loudly instead of silently training a flat head.
  hslm: true
  family_weight: 3.0                # coarse errors penalised more (trades top-1 for HD)
  genus_weight: 2.0
  species_weight: 1.0
  beta: 0.99                        # CB-Focal effective-number smoothing
  gamma: 1.0                        # CB-Focal focal gamma

  # --- decoupled head re-training (optional, off by default) ---
  # Two-stage long-tail trick: train the full model, then re-train only the head
  # with class-balanced sampling from `checkpoint`. Leave off for a standard run.
  decouple: false
  checkpoint: bioreef_stage1_ddp.pt # only used when decouple: true

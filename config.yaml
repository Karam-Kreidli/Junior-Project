# =============================================================================
# BioReef.ai — Pipeline Configuration
# =============================================================================
# This file is the single control center for the whole pipeline. Edit values
# here; the pipelines read them — there are no command-line flags.
#
#   inference:  python inference/inference_pipeline.py            (reads this file)
#   training:   python training/train_pipeline.py                (reads this file)
#   override file location with --config <path> if needed.
#
# Defaults below match the established setup: detector conf 0.3, WaterNet OFF in
# inference (#14), recovered 256-class species CSV (#24), the tuned tracker with
# the motion gate (#11).
# =============================================================================

# ---- Shared (used by both training and inference) ---------------------------
shared:
  # Species/taxonomy metadata CSV. Defaults to the recovered 256-class subset
  # that matches bioreef_stage1.pt (see #24). Do NOT point at the full
  # 307-species frame_metadata.csv with that checkpoint.
  csv_path: data_oz/metadata/frame_metadata_subset.csv
  min_samples: 20
  device: null            # null -> cuda if available; or "cuda:0" / "cuda:1" / "cpu"
  apply_waternet: false   # #14: keep OFF for the detector (hurts recall ~5.6pp)

# ---- Inference pipeline -----------------------------------------------------
inference:
  # --- input ---
  video: null                       # path to a single clip, OR set frames_dir
  frames_dir: null                  # list of frame dirs (alternative to video)
  video_id: null                    # cache key / output name; null -> derived

  # --- preprocessing ---
  # (frame extraction + optional restore handled by the shared preprocess step)

  # --- detector (Stage 0) ---
  detector_backend: rfdetr          # rfdetr | yolo
  detection_ckpt: null              # null -> backend default (weights/rfdetr_medium_cfd.pth)
  rfdetr_size: medium               # medium | small | nano
  imgsz: 960                        # yolo only
  conf_threshold: 0.3               # detection confidence floor

  # --- Stage 1 (classifier) ---
  stage1_ckpt: bioreef_stage1.pt

  # --- Stage 2 (tracker) ---
  high_thresh: 0.6
  low_thresh: 0.1
  max_lost_age: 30
  iou_threshold: 0.3
  appearance_threshold: 0.4
  ema_alpha: 0.9
  no_cmc: false
  min_tracklet_len: 16
  max_tracklet_len: 30

  # --- Stage 2 aggregation (#5 hierarchical fallback) ---
  species_thresh: 0.50
  genus_thresh: 0.60
  family_thresh: 0.70

  # --- Stage 3 (future) ---
  run_stage3: false

  # --- output / cache ---
  output_dir: outputs/detections
  cache_dir: outputs/cache          # null disables stage caching
  no_cache: false
  from_stage: preprocess            # preprocess | stage1 | stage2 | stage3
  to_stage: stage2

# ---- Training pipeline ------------------------------------------------------
# train_stage1.py is a DDP multi-GPU trainer — launch with torchrun, e.g.:
#   torchrun --nproc_per_node=2 scripts/training/train_stage1.py
# It reads these values (the training loop itself is unchanged).
training:
  # Training uses the FULL metadata CSV (its split_dataset does the placeholder/
  # image-on-disk/min_samples filtering itself, #24) — NOT the recovered subset.
  csv_path: frame_metadata.csv
  img_dir: data_oz/frames_waternet_1
  use_waternet: false
  epochs: null                      # null -> 30 standard / 10 decoupled
  decouple: false
  checkpoint: bioreef_stage1_ddp.pt # checkpoint to load in decoupled mode
  beta: 0.99                        # CB-Focal effective-number smoothing
  gamma: 1.0                        # CB-Focal focal gamma
  warmup_epochs: 3
  ema_decay: 0.999
  batch_size: 8                     # per-rank
  hslm: false                       # use HSLM loss (genus/family terms) vs CB-Focal
  family_weight: 3.0                # HSLM weights
  genus_weight: 2.0
  species_weight: 1.0
